<div class="app-layout">
  <header class="topbar">
    <button class="topbar__toggle" (click)="toggleMenu()" aria-label="Toggle menu">
      <span class="topbar__hamburger"></span>
    </button>
    <span class="topbar__title">Taskflurry</span>
  </header>

  @if (menuOpen()) {
    <div class="overlay" (click)="toggleMenu()"></div>
  }

  <nav class="sidebar" [class.sidebar--open]="menuOpen()">
    <div class="sidebar-header">
      <h1 class="logo">Taskflurry</h1>
      <p class="tagline">Powered by flurryx</p>
    </div>
    <ul class="nav-links">
      <li>
        <a routerLink="/projects" routerLinkActive="active">Projects</a>
      </li>
      <li>
        <a routerLink="/tasks" routerLinkActive="active">Tasks</a>
      </li>
    </ul>
  </nav>
  <main class="content">
    <router-outlet />
  </main>
</div>
<app-snackbar />
<app-store-devtools />
